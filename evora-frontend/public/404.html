<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVORA – Made to Celebrate</title>
    <script>
      // Single Page App redirect for deep links on refresh
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #FDFBF7;
        color: #8B7355;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #C9A13A;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 15px; font-weight: 500;">Refreshing celebration portal…</p>
    </div>
  </body>
</html>
